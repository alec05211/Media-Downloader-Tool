<!doctype html><html><head><meta charset="utf-8"><title>Media Downloader</title><style>body{font-family:system-ui,sans-serif;max-width:780px;margin:48px auto;background:#10131a;color:#eef2ff;padding:0 20px}.muted{color:#aab4cd}form{background:#1c2230;border:1px solid #2e3950;border-radius:10px;padding:18px;margin:20px 0}.entry{display:flex}.entry input{min-width:0;flex:1;box-sizing:border-box;padding:12px;border-radius:6px 0 0 6px;border:1px solid #4b5b7c;background:#111722;color:white;font-size:15px}.entry button{margin:0;border-radius:0 6px 6px 0;padding:10px 14px;background:#76a7ff;border:0;font-weight:700;cursor:pointer}.choice{margin:12px 8px 0 0;padding:10px 14px;background:#273650;color:white;border:0;border-radius:6px;font-weight:700;cursor:pointer}video,#preview img{display:block;max-width:100%;max-height:380px;border-radius:8px;margin-top:14px}footer{font-size:13px;color:#aab4cd}.entry button:disabled{background:#526174;cursor:wait}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}dialog{max-width:680px;width:calc(100% - 40px);background:#1c2230;color:#eef2ff;border:1px solid #4b5b7c;border-radius:10px;padding:20px}dialog::backdrop{background:#0009}dialog textarea{width:100%;height:210px;box-sizing:border-box;background:#111722;color:#eef2ff;border:1px solid #4b5b7c;border-radius:6px;padding:10px;resize:vertical}dialog button{margin:12px 8px 0 0;padding:8px 12px;border:0;border-radius:6px;background:#76a7ff;font-weight:700;cursor:pointer}.format-options{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:18px auto}.format-options .choice{margin:0}</style></head><body><h1>Media Downloader</h1><form id="form"><div class="entry"><input id="url" type="url" placeholder="Paste a YouTube, TikTok, Instagram, X, or Reddit link" required><button id="action">Paste link</button></div><span id="message" hidden></span><div id="preview"></div><dialog id="errorDialog"><textarea id="errorText" readonly aria-label="Error details"></textarea><button type="button" onclick="copyError()">Copy details</button><button type="button" onclick="errorDialog.close()">Close</button></dialog></form><script>const form=document.getElementById('form'),url=document.getElementById('url'),action=document.getElementById('action'),message=document.getElementById('message'),preview=document.getElementById('preview'),errorDialog=document.getElementById('errorDialog'),errorText=document.getElementById('errorText');let active='';function showError(code,text,raw=''){errorText.value=code+' — '+text+(raw?'\n\nDiagnostic: '+raw:'');errorDialog.showModal();errorText.focus();errorText.select()}async function copyError(){try{await navigator.clipboard.writeText(errorText.value)}catch{errorText.select();document.execCommand('copy')}}function clearError(){}function setLoading(loading){action.disabled=loading;action.innerHTML=loading?'<span class="spinner"></span>':(url.value.trim()?'Confirm':'Paste link')}const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function updateAction(){action.textContent=url.value.trim()?'Confirm':'Paste link'}async function choose(){setLoading(true);message.textContent='Checking available formats…';preview.innerHTML='';let r=await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value})}),d=await r.json();if(!r.ok){showError(d.code||'API400',d.error);setLoading(false);return}let gif=d.seconds<=30;preview.innerHTML=`<section class="format-options"><span>Choose a format to download:</span><button class="choice" data-mode="video">MP4</button>`+(gif?'<button class="choice" data-mode="gif">GIF</button>':'')+'<button class="choice" data-mode="audio">MP3</button>'+(d.media_url?`<video controls preload="metadata" poster="${esc(d.thumbnail)}"><source src="${esc(d.media_url)}"></video>`:(d.thumbnail?`<img src="${esc(d.thumbnail)}" alt="Video thumbnail">`:'')+'</section>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>start(b.dataset.mode,d.title));message.textContent=gif?'Select MP4 or GIF to download.':'Select MP4 to download. GIF is available for clips up to 30 seconds.';setLoading(false)}async function start(mode,title){active=url.value;message.textContent='Choose an exact file name and save location…';let r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:active,mode,title})}),d=await r.json();if(!r.ok)showError(d.code||'API400',d.error)}async function status(){if(!active)return;let d=await fetch('/api/status').then(r=>r.json()),j=d.jobs.find(x=>x.url===active);if(!j)return;if(j.status==='complete'){active=''}if(j.status==='failed'){showError(j.code||'DL999',j.error||'Download failed.',j.log);active=''}}form.onsubmit=async e=>{e.preventDefault();if(url.value.trim())choose();else{try{let clip=await fetch('/api/clipboard').then(x=>x.json());url.value=(clip.text||'').trim();updateAction();if(!url.value)showError('CLIP001','The clipboard is empty or its contents cannot be read.')}catch{message.textContent='Clipboard access was not allowed. Paste a link into the field.'}}};url.oninput=()=>{preview.innerHTML='';clearError();updateAction()};setInterval(status,1500)</script><script>
(() => {
  const input = document.getElementById('url');
  const button = document.getElementById('action');
  const output = document.getElementById('preview');
  const fail = (code, text) => {
    const dialog = document.getElementById('errorDialog');
    const details = document.getElementById('errorText');
    details.value = `${code} — ${text}`; dialog.showModal(); details.select();
  };
  const update = () => { button.disabled = false; button.textContent = input.value.trim() ? 'Confirm' : 'Paste link'; };
  const download = async (mode, title) => {
    button.disabled = true; button.textContent = '…';
    const response = await fetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:input.value.trim(),mode,title})});
    const data = await response.json(); update(); if (!response.ok) fail(data.code || 'API400', data.error || 'Download could not start.');
  };
  const formats = async () => {
    button.disabled = true; button.innerHTML = '<span class="spinner"></span>';
    const response = await fetch('/api/preview', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:input.value.trim()})});
    const data = await response.json(); update();
    if (!response.ok) { fail(data.code || 'API400', data.error || 'Could not inspect this link.'); return; }
    const gif = data.seconds <= 30;
    output.innerHTML = '<section class="format-options"><span>Choose a format to download:</span><button class="choice" data-mode="video">MP4</button>' + (gif ? '<button class="choice" data-mode="gif">GIF</button>' : '') + '<button class="choice" data-mode="audio">MP3</button>' + (data.media_url ? `<video controls preload="metadata" src="${data.media_url}"></video>` : '') + '</section>';
    output.querySelectorAll('.choice').forEach(choice => choice.onclick = () => download(choice.dataset.mode, data.title));
  };
  button.type = 'button';
  button.onclick = async () => {
    if (input.value.trim()) { await formats(); return; }
    button.disabled = true; button.innerHTML = '<span class="spinner"></span>';
    try { const data = await fetch('/api/clipboard').then(r => r.json()); input.value = (data.text || '').trim(); }
    catch { fail('CLIP001', 'The Windows clipboard could not be read.'); }
    update();
  };
  input.addEventListener('input', () => { output.innerHTML = ''; update(); });
  update();
})();
</script></body></html>
